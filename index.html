<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tingo Tango - Modalidades de Exportación | Prof. Alberto Araque A.</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #121212;
      color: white;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 25px;
      margin: 20px auto;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 5px;
    }
    .btn-audio {
      background: #2b2b2b;
      color: #4cc9f0;
      border: 1px solid #3d3d3d;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 20px;
      cursor: pointer;
    }
    .btn-audio:hover {
      background: #363636;
    }
    h1 {
      color: #e63946;
      margin-bottom: 5px;
      font-size: 24px;
    }
    h3 {
      color: #4cc9f0;
      margin-top: 0;
      font-size: 15px;
      font-weight: 400;
    }
    .docente {
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 18px;
    }
    input {
      padding: 12px;
      width: 78%;
      border-radius: 8px;
      border: 1px solid #333;
      margin-bottom: 10px;
      font-size: 16px;
      text-align: center;
      background: #2b2b2b;
      color: white;
      outline: none;
    }
    input:focus {
      border-color: #4cc9f0;
    }
    .lista-jugadores {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px 0 18px 0;
    }
    .chip {
      background: #2b2b2b;
      border: 1px solid #3d3d3d;
      color: #f1faee;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
    }
    button.main-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      width: 85%;
      margin-top: 6px;
    }
    button.main-btn:hover {
      background: #d62828;
    }
    button.sec-btn {
      background: #2b2b2b;
      color: #4cc9f0;
      border: 1px solid #4cc9f0;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button.sec-btn:hover {
      background: rgba(76, 201, 240, 0.12);
    }
    .pelota {
      font-size: 1.8rem;
      color: #ffb703;
      font-weight: bold;
      margin-top: 15px;
      min-height: 42px;
    }
    .pelota.activa {
      animation: pulso 0.45s infinite alternate;
    }
    @keyframes pulso {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }
    .penitencia {
      background: #2b2b2b;
      border-left: 4px solid #e63946;
      padding: 16px;
      margin-top: 15px;
      border-radius: 6px;
      text-align: left;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.15);
      color: #4cc9f0;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-bar">
      <button id="btnMusica" class="btn-audio" onclick="toggleMusica()">🎵 Música: ON</button>
    </div>

    <h1>TINGO TANGO 🤾</h1>
    <h3>Modalidades de Exportación y Régimen Aduanero</h3>
    <div class="docente">Docente: Alberto Araque A.</div>

    <!-- Paso 1: Agregar participantes en la sala web -->
    <div id="registro">
      <input type="text" id="nombreInput" placeholder="Nombre del estudiante o participante" onkeydown="if(event.key==='Enter') agregarJugador()">
      <br>
      <button class="sec-btn" onclick="agregarJugador()">+ Agregar Participante</button>

      <div id="listaJugadores" class="lista-jugadores"></div>

      <button class="main-btn" onclick="entrarAlJuego()">Ir a Jugar</button>
    </div>

    <!-- Paso 2: Pantalla de juego -->
    <div id="pantallaJuego" style="display:none;">
      <h2 id="estado">Listo para comenzar</h2>
      <div id="poseedor" class="pelota">---</div>

      <div id="seccionPenitencia" class="penitencia" style="display:none;">
        <span id="categoriaPregunta" class="badge">Pregunta de Clase</span>
        <br>
        <strong>Pregunta / Reto:</strong>
        <p id="textoPenitencia" style="margin: 8px 0 0 0;"></p>
      </div>

      <br>
      <button id="btnIniciar" class="main-btn" onclick="iniciarRonda()">¡Iniciar Ronda!</button>
      <button class="sec-btn" style="margin-top:10px;" onclick="volverRegistro()">Editar Participantes</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    let musicaActiva = true;
    let ritmoInterval = null;
    let pasoRitmo = 0;

    let jugadores = [];
    let intervaloPelota = null;
    let timeoutTango = null;
    let indiceActual = 0;
    let rondaActiva = false;

    // Preguntas de la dinámica
    const bancoPreguntas = [
      {
        categoria: "Autoridad Aduanera",
        texto: "¿Nos explica brevemente qué conoce usted de la DIAN?"
      },
      {
        categoria: "Régimen Franco",
        texto: "¿Nos explica qué conoce de una Zona Franca?"
      },
      {
        categoria: "Negociación Internacional",
        texto: "¿Qué son los términos de negociación internacional - INCOTERMS?"
      },
      {
        categoria: "Clasificación y Tributos",
        texto: "¿Qué logramos entender por Arancel de Aduanas?"
      }
    ];

    let colaPreguntas = [];

    function obtenerSiguientePregunta() {
      if (colaPreguntas.length === 0) {
        colaPreguntas = [...bancoPreguntas].sort(() => Math.random() - 0.5);
      }
      return colaPreguntas.pop();
    }

    function renderizarJugadores() {
      const contenedor = document.getElementById('listaJugadores');
      contenedor.innerHTML = '';
      jugadores.forEach((nombre, idx) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = `${nombre} <span style="cursor:pointer;color:#e63946;margin-left:6px;" onclick="quitarJugador(${idx})">✕</span>`;
        contenedor.appendChild(chip);
      });
    }

    function agregarJugador() {
      const input = document.getElementById('nombreInput');
      const nombre = input.value.trim();
      if (!nombre) return;
      jugadores.push(nombre);
      input.value = '';
      input.focus();
      renderizarJugadores();
    }

    function quitarJugador(idx) {
      jugadores.splice(idx, 1);
      renderizarJugadores();
    }

    function entrarAlJuego() {
      if (jugadores.length === 0) {
        alert('Agrega al menos un participante antes de continuar.');
        return;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      document.getElementById('registro').style.display = 'none';
      document.getElementById('pantallaJuego').style.display = 'block';
    }

    function volverRegistro() {
      detenerRonda();
      document.getElementById('pantallaJuego').style.display = 'none';
      document.getElementById('registro').style.display = 'block';
    }

    function toggleMusica() {
      musicaActiva = !musicaActiva;
      document.getElementById('btnMusica').innerText = musicaActiva ? '🎵 Música: ON' : '🔇 Música: OFF';
      if (!musicaActiva) {
        detenerMusicaFondo();
      } else if (rondaActiva) {
        iniciarMusicaFondo();
      }
    }

    function iniciarMusicaFondo() {
      detenerMusicaFondo();
      if (!musicaActiva || audioCtx.state === 'suspended') return;

      const notasBase = [261.63, 293.66, 329.63, 392.00, 440.00, 392.00, 329.63, 293.66];
      pasoRitmo = 0;

      ritmoInterval = setInterval(() => {
        if (!musicaActiva) return;

        const now = audioCtx.currentTime;
        const freq = notasBase[pasoRitmo % notasBase.length];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.06, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.24);

        if (pasoRitmo % 2 === 0) {
          const kickOsc = audioCtx.createOscillator();
          const kickGain = audioCtx.createGain();
          kickOsc.type = 'sine';
          kickOsc.frequency.setValueAtTime(110, now);
          kickOsc.frequency.exponentialRampToValueAtTime(48, now + 0.12);

          kickGain.gain.setValueAtTime(0.08, now);
          kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

          kickOsc.connect(kickGain);
          kickGain.connect(audioCtx.destination);
          kickOsc.start(now);
          kickOsc.stop(now + 0.14);
        }

        pasoRitmo++;
      }, 260);
    }

    function detenerMusicaFondo() {
      if (ritmoInterval) {
        clearInterval(ritmoInterval);
        ritmoInterval = null;
      }
    }

    function reproducirSonidoTingo() {
      if (!musicaActiva) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(640, now);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    function reproducirSonidoTango() {
      detenerMusicaFondo();
      if (!musicaActiva) return;

      const now = audioCtx.currentTime;
      const freqs = [220, 185, 146.83];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        const start = now + idx * 0.12;
        osc.frequency.setValueAtTime(f, start);
        gain.gain.setValueAtTime(0.14, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.48);
      });
    }

    function detenerRonda() {
      rondaActiva = false;
      if (intervaloPelota) clearInterval(intervaloPelota);
      if (timeoutTango) clearTimeout(timeoutTango);
      intervaloPelota = null;
      timeoutTango = null;
      detenerMusicaFondo();
      document.getElementById('btnIniciar').disabled = false;
    }

    function iniciarRonda() {
      if (jugadores.length === 0 || rondaActiva) return;

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      detenerRonda();
      rondaActiva = true;
      document.getElementById('btnIniciar').disabled = true;
      document.getElementById('seccionPenitencia').style.display = 'none';
      document.getElementById('estado').innerText = 'Tingo, tingo, tingo...';

      indiceActual = Math.floor(Math.random() * jugadores.length);
      const poseedorEl = document.getElementById('poseedor');
      poseedorEl.innerText = '👉 ' + jugadores[indiceActual];
      poseedorEl.classList.add('activa');

      iniciarMusicaFondo();
      reproducirSonidoTingo();

      const duracionMs = Math.floor(Math.random() * 5500) + 4500; // Entre 4.5 y 10 segundos

      intervaloPelota = setInterval(() => {
        indiceActual = (indiceActual + 1) % jugadores.length;
        poseedorEl.innerText = '👉 ' + jugadores[indiceActual];
        reproducirSonidoTingo();
      }, 750);

      timeoutTango = setTimeout(() => {
        detenerRonda();
        poseedorEl.classList.remove('activa');
        document.getElementById('estado').innerText = '¡TANGO! 🛑';
        poseedorEl.innerText = 'Le tocó a: ' + jugadores[indiceActual];

        const pregunta = obtenerSiguientePregunta();
        document.getElementById('categoriaPregunta').innerText = pregunta.categoria;
        document.getElementById('textoPenitencia').innerText = pregunta.texto;
        document.getElementById('seccionPenitencia').style.display = 'block';

        reproducirSonidoTango();
      }, duracionMs);
    }
  </script>
</body>
</html>
