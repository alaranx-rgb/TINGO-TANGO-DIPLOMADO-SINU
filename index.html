<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tingo Tango - Diplomado Sinú | Prof. Alberto Araque A.</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #121212;
      color: white;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      margin: 16px auto;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #a0a0a0;
    }
    .btn-audio {
      background: #2b2b2b;
      color: #4cc9f0;
      border: 1px solid #3d3d3d;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 20px;
      cursor: pointer;
    }
    h1 {
      color: #e63946;
      margin: 6px 0 4px 0;
      font-size: 24px;
    }
    h3 {
      color: #4cc9f0;
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 400;
    }
    .docente {
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 18px;
    }
    input {
      padding: 12px;
      width: 82%;
      border-radius: 8px;
      border: 1px solid #333;
      margin-bottom: 12px;
      font-size: 16px;
      text-align: center;
      background: #2b2b2b;
      color: white;
      outline: none;
    }
    input:focus {
      border-color: #4cc9f0;
    }
    button.main-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      width: 86%;
    }
    button.main-btn:hover {
      background: #d62828;
    }
    .conectados-box {
      background: #171717;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      padding: 10px;
      margin-top: 16px;
    }
    .conectados-titulo {
      font-size: 12px;
      color: #4cc9f0;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .lista-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .chip {
      background: #2b2b2b;
      border: 1px solid #3d3d3d;
      color: #f1faee;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
    }
    .pelota {
      font-size: 1.8rem;
      color: #ffb703;
      font-weight: bold;
      margin-top: 14px;
      min-height: 42px;
    }
    .pelota.activa {
      animation: pulso 0.45s infinite alternate;
    }
    @keyframes pulso {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }
    .penitencia {
      background: #2b2b2b;
      border-left: 4px solid #e63946;
      padding: 16px;
      margin-top: 15px;
      border-radius: 6px;
      text-align: left;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.15);
      color: #4cc9f0;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-bar">
      <span id="contadorSala">Conectados: 0</span>
      <button id="btnMusica" class="btn-audio" onclick="toggleMusica()">🎵 Suspenso: ON</button>
    </div>

    <h1>TINGO TANGO 🤾</h1>
    <h3>Modalidades de Exportación y Régimen Aduanero</h3>
    <div class="docente">Docente: Alberto Araque A.</div>

    <div id="registro">
      <input type="text" id="nombreInput" placeholder="Escribe tu nombre y apellido" onkeydown="if(event.key==='Enter') unirme()">
      <br>
      <button class="main-btn" onclick="unirme()">Unirme a la Sala</button>
    </div>

    <div id="pantallaJuego" style="display:none;">
      <h2 id="estado">Esperando inicio de ronda...</h2>
      <div id="poseedor" class="pelota">---</div>

      <div id="seccionPenitencia" class="penitencia" style="display:none;">
        <span id="categoriaPregunta" class="badge">Pregunta de Clase</span>
        <br>
        <strong>Pregunta / Reto:</strong>
        <p id="textoPenitencia" style="margin: 8px 0 0 0;"></p>
      </div>

      <br>
      <button class="main-btn" onclick="iniciar()">¡Iniciar Ronda!</button>
    </div>

    <div class="conectados-box">
      <div class="conectados-titulo">Participantes en sala</div>
      <div id="listaConectados" class="lista-chips">
        <span style="color:#777; font-size:13px;">Aún no hay participantes...</span>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    let musicaActiva = true;
    let suspensoInterval = null;
    let pasoSuspenso = 0;

    function asegurarAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleMusica() {
      musicaActiva = !musicaActiva;
      document.getElementById('btnMusica').innerText = musicaActiva ? '🎵 Suspenso: ON' : '🔇 Suspenso: OFF';
      if (!musicaActiva) {
        detenerSuspenso();
      } else {
        asegurarAudio();
      }
    }

    function tocarNotaSuspenso(freq, duracion, tipo, volumen, inicio) {
      const osc = audioCtx.createOscillator();
      const filtro = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = tipo;
      osc.frequency.setValueAtTime(freq, inicio);

      filtro.type = 'lowpass';
      filtro.frequency.setValueAtTime(950, inicio);

      gain.gain.setValueAtTime(0.001, inicio);
      gain.gain.linearRampToValueAtTime(volumen, inicio + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0008, inicio + duracion);

      osc.connect(filtro);
      filtro.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(inicio);
      osc.stop(inicio + duracion + 0.02);
    }

    function tocarLatido(inicio) {
      // Doble pulso tipo latido de suspenso (lub-dub)
      const golpes = [0, 0.14];
      golpes.forEach((offset, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = inicio + offset;
        const fInicio = idx === 0 ? 92 : 74;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(fInicio, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 0.11);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.24, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.13);
      });
    }

    function iniciarSuspenso() {
      detenerSuspenso();
      asegurarAudio();
      if (!musicaActiva || !audioCtx) return;

      // Escala cromática / menor tensa de suspenso (Re menor / semitonos de tensión)
      const melodiaTensa = [
        146.83, 155.56, 146.83, 220.00,
        207.65, 196.00, 155.56, 146.83
      ];
      const pedalGrave = [73.42, 73.42, 69.30, 65.41];

      pasoSuspenso = 0;

      const ejecutarPaso = () => {
        if (!musicaActiva || !audioCtx || audioCtx.state !== 'running') return;

        const now = audioCtx.currentTime;
        const notaAlta = melodiaTensa[pasoSuspenso % melodiaTensa.length];

        // Melodía de suspenso
        tocarNotaSuspenso(notaAlta, 0.28, 'sawtooth', 0.09, now);
        // Armónico sutil una quinta arriba en ciertos pasos
        if (pasoSuspenso % 2 === 1) {
          tocarNotaSuspenso(notaAlta * 1.498, 0.24, 'triangle', 0.06, now);
        }

        // Bajo sostenido cada 2 pasos
        if (pasoSuspenso % 2 === 0) {
          const bajo = pedalGrave[Math.floor(pasoSuspenso / 2) % pedalGrave.length];
          tocarNotaSuspenso(bajo, 0.54, 'triangle', 0.16, now);
        }

        // Latido de tensión cada 4 pasos
        if (pasoSuspenso % 4 === 0) {
          tocarLatido(now);
        }

        pasoSuspenso++;
      };

      ejecutarPaso();
      suspensoInterval = setInterval(ejecutarPaso, 290);
    }

    function detenerSuspenso() {
      if (suspensoInterval) {
        clearInterval(suspensoInterval);
        suspensoInterval = null;
      }
    }

    function reproducirSonidoTingo() {
      if (!musicaActiva) return;
      asegurarAudio();
      if (!audioCtx || audioCtx.state !== 'running') return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.09);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.14, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    function reproducirSonidoTango() {
      detenerSuspenso();
      if (!musicaActiva) return;
      asegurarAudio();
      if (!audioCtx || audioCtx.state !== 'running') return;

      const now = audioCtx.currentTime;
      // Golpe dramático de detención (¡TANGO!)
      const acordesCaida = [
        { freq: 146.83, delay: 0, dur: 0.45 },
        { freq: 110.00, delay: 0.14, dur: 0.45 },
        { freq: 98.00,  delay: 0.28, dur: 0.65 }
      ];

      acordesCaida.forEach((item) => {
        const start = now + item.delay;
        tocarNotaSuspenso(item.freq, item.dur, 'sawtooth', 0.18, start);
        tocarNotaSuspenso(item.freq * 0.5, item.dur, 'sine', 0.22, start);
      });
    }

    function unirme() {
      const nombre = document.getElementById('nombreInput').value.trim();
      if (nombre) {
        asegurarAudio();
        socket.emit('unirse', nombre);
        document.getElementById('registro').style.display = 'none';
        document.getElementById('pantallaJuego').style.display = 'block';
      }
    }

    function iniciar() {
      asegurarAudio();
      socket.emit('iniciarJuego');
    }

    socket.on('listaJugadores', (lista) => {
      document.getElementById('contadorSala').innerText = 'Conectados: ' + lista.length;
      const contenedor = document.getElementById('listaConectados');
      if (!lista || lista.length === 0) {
        contenedor.innerHTML = '<span style="color:#777; font-size:13px;">Aún no hay participantes...</span>';
        return;
      }
      contenedor.innerHTML = lista
        .map((j) => `<span class="chip">👤 ${j.nombre}</span>`)
        .join('');
    });

    socket.on('estadoPelota', (data) => {
      if (!suspensoInterval && musicaActiva) {
        iniciarSuspenso();
      }
      document.getElementById('seccionPenitencia').style.display = 'none';
      document.getElementById('estado').innerText = 'Tingo, tingo, tingo...';
      const poseedorEl = document.getElementById('poseedor');
      poseedorEl.innerText = '👉 ' + data.poseedor.nombre;
      poseedorEl.classList.add('activa');
      reproducirSonidoTingo();
    });

    socket.on('tangoFinal', (data) => {
      const poseedorEl = document.getElementById('poseedor');
      poseedorEl.classList.remove('activa');
      document.getElementById('estado').innerText = '¡TANGO! 🛑';
      poseedorEl.innerText = 'Le tocó a: ' + data.perdedor.nombre;

      document.getElementById('categoriaPregunta').innerText = data.categoria || 'Pregunta de Clase';
      document.getElementById('textoPenitencia').innerText = data.penitencia;
      document.getElementById('seccionPenitencia').style.display = 'block';

      reproducirSonidoTango();
    });
  </script>
</body>
</html>
